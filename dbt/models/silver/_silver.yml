version: 2

models:
  - name: orders
    columns:
      - name: business_date
        data_tests: [not_null]
      - name: order_id
        data_tests: [not_null, unique]
  - name: order_items
    columns:
      - name: order_id
        data_tests: [not_null]
      - name: product_id
        data_tests: [not_null]
  - name: payments
    columns:
      - name: order_id
        data_tests: [not_null]
  - name: quarantine
    columns:
      - name: failure_reason
        data_tests: [not_null]
