# Credentials come from .env (git-ignored; copy .env.example). Compose refuses to start if a required one is missing.
x-clickhouse: &clickhouse
  image: clickhouse/clickhouse-server:25.8
  environment:
    CLICKHOUSE_USER: ${WAREHOUSE_USER:?set WAREHOUSE_USER in .env}
    CLICKHOUSE_PASSWORD: ${WAREHOUSE_PASSWORD:?set WAREHOUSE_PASSWORD in .env}
    CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
  ulimits:
    nofile: { soft: 262144, hard: 262144 }

services:
  shop-db:
    image: postgres:17
    environment:
      POSTGRES_USER: ${SHOP_DB_USER:?set SHOP_DB_USER in .env}
      POSTGRES_PASSWORD: ${SHOP_DB_PASSWORD:?set SHOP_DB_PASSWORD in .env}
      POSTGRES_DB: ${SHOP_DB_NAME:-shop}
    ports: ["${SHOP_DB_PORT:-5433}:5432"]
    volumes: [shop-data:/var/lib/postgresql/data]

  warehouse:
    <<: *clickhouse
    ports: ["${WAREHOUSE_PORT:-8123}:8123"]
    volumes: [warehouse-data:/var/lib/clickhouse]

  # Throwaway warehouse for pytest; no volume, so it starts empty every time.
  warehouse-test:
    <<: *clickhouse
    ports: ["8124:8123"]

  airflow-db:
    image: postgres:17
    environment:
      POSTGRES_USER: ${AIRFLOW_DB_USER:?set AIRFLOW_DB_USER in .env}
      POSTGRES_PASSWORD: ${AIRFLOW_DB_PASSWORD:?set AIRFLOW_DB_PASSWORD in .env}
      POSTGRES_DB: airflow
    volumes: [airflow-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\""]
      interval: 5s
      retries: 12

  airflow:
    build:
      context: .
      dockerfile: airflow/Dockerfile
    command: standalone
    restart: unless-stopped
    depends_on:
      airflow-db: {condition: service_healthy}
      shop-db: {condition: service_started}
      warehouse: {condition: service_started}
    ports: ["8080:8080"]
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${AIRFLOW_DB_USER}:${AIRFLOW_DB_PASSWORD}@airflow-db/airflow
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "True"
      SHOP_DB_HOST: shop-db
      SHOP_DB_PORT: "5432"
      SHOP_DB_NAME: ${SHOP_DB_NAME:-shop}
      SHOP_DB_USER: ${SHOP_DB_USER}
      SHOP_DB_PASSWORD: ${SHOP_DB_PASSWORD}
      WAREHOUSE_HOST: warehouse
      WAREHOUSE_PORT: "8123"
      WAREHOUSE_USER: ${WAREHOUSE_USER}
      WAREHOUSE_PASSWORD: ${WAREHOUSE_PASSWORD}
      CATALOG_PATH: /opt/pipeline/data/catalog/merchandising_catalog.xlsx
      DBT_DIR: /opt/pipeline/dbt
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./src:/opt/pipeline/src
      - ./dbt:/opt/pipeline/dbt
      - ./data:/opt/pipeline/data

volumes:
  shop-data:
  warehouse-data:
  airflow-data:
